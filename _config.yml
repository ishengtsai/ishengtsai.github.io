# Shared Jekyll integration, 26 November 2026. Original sources preserved in the dated backup.
site: Tsai Lab
title: Tsai Lab
description: Fungal ecology, evolution and microbial interactions at Academia Sinica, Taiwan.
url: https://ecogenomics.biodiv.tw
baseurl: ""
timezone: Asia/Taipei
local_preview: false
collections:
  pages:
    output: true
    permalink: /:name/
  posts:
    output: true
    permalink: /blog/:slug/
  projects:
    output: true
    permalink: /project/:slug/
defaults:
  - scope:
      path: ""
    values:
      layout: 2026.11.26.v05.Lab_Article
  - scope:
      path: ""
      type: projects
    values:
      layout: 2026.11.26.v05.Lab_Article
      nav_section: research
  - scope:
      path: ""
      type: posts
    values:
      layout: 2026.11.26.v05.Lab_Article
      nav_section: lab-life
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-sitemap
google_analytics: G-6RX3MPLW09
# Local archives and build files are never published.
exclude:
  - css
  - js
  - zz_backup
  - Gemfile.md
  - Gemfile.md.lock
  - package-lock.json
  - 2026.11.26.v01.Jekyll_Dependencies.rb
  - 2026.11.26.v01.Jekyll_Integration_Guide.md
  - 2026.11.26.v01.Lab_Image_Manifest.json
  - _archive
  - .jekyll-cache
  - _cache
  - _site

lab_header: 2026.11.26.v09.Lab_Header.html
lab_footer: 2026.11.26.v02.Lab_Footer.html
lab_stylesheet: /assets/css/2026.11.26.v23.Lab_Website.css
lab_script: /assets/js/2026.11.26.v11.Lab_Website.js
